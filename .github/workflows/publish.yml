name: Publish

# Release: `npm version patch|minor|major`, then `git push --follow-tags`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted publishing: npm verifies GitHub's OIDC token instead of an npm token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check
      - run: npx vitest --run
      - run: npx playwright test
      # Builds the package (prepack), then publishes with provenance.
      - run: npm publish --access public
